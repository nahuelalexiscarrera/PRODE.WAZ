<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Ícono de la app PRODE.WAZ — marca de la plataforma (W serif lila sobre negro).
    El raster canónico de la marca es /logowaze.png (1254px); los PNG del set
    (icon-192/512, apple-touch-icon, favicons, favicon.ico) se generan desde ahí.
    Este SVG es la fuente editable equivalente.
  -->
  <rect width="512" height="512" fill="#000000"/>
  <text x="256" y="372"
        text-anchor="middle"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-weight="500"
        font-size="430"
        fill="#F6D1FD">W</text>
</svg>
